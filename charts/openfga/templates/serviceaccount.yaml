{{- if .Values.serviceAccount.create -}}
{{- $annotations := .Values.serviceAccount.annotations | default dict -}}
{{- if eq (include "openfga.migrate.usePreInstallHooks" .) "true" -}}
{{/*
When the migration Job runs as a pre-install/pre-upgrade hook (externally provided datastore), its
ServiceAccount must already exist when the hook fires — otherwise the Job's pod is rejected with
"error looking up service account". Promote the ServiceAccount to the same hook events with a lower
weight (-10 < the Job's -5) so Helm creates it first; user-supplied annotations are merged in.
*/}}
{{- $annotations = merge (dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-weight" "-10" "helm.sh/hook-delete-policy" "before-hook-creation") $annotations -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openfga.serviceAccountName" . }}
  labels:
    {{- include "openfga.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
